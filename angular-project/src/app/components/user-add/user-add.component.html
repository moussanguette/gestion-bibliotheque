<div *ngIf="isVisible" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">
        <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        Ajouter un nouvel utilisateur
      </h3>
      <button
        type="button"
        (click)="handleCancel()"
        class="close-button"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <form (ngSubmit)="handleSubmit()" class="modal-content">
      <div class="form-grid">
        <!-- Nom complet -->
        <div class="form-group span-2">
          <label for="name" class="form-label required">Nom complet</label>
          <input
            id="name"
            type="text"
            [(ngModel)]="formData.name"
            name="name"
            placeholder="Jean Dupont"
            class="form-input"
            required
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label required">Adresse email</label>
          <div class="email-container">
            <input
              id="email"
              type="email"
              [(ngModel)]="formData.email"
              name="email"
              placeholder="jean.dupont@example.com"
              class="form-input email-input"
              required
            />
            <button
              type="button"
              (click)="generateEmail()"
              class="email-generate-btn"
              title="Générer un email basé sur le nom"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Téléphone -->
        <div class="form-group">
          <label for="phoneNumber" class="form-label">Numéro de téléphone</label>
          <input
            id="phoneNumber"
            type="tel"
            [(ngModel)]="formData.phoneNumber"
            name="phoneNumber"
            placeholder="+33 1 23 45 67 89"
            class="form-input"
          />
        </div>

        <!-- Statut -->
        <div class="form-group">
          <label for="status" class="form-label required">Statut</label>
          <select
            id="status"
            [(ngModel)]="formData.status"
            name="status"
            class="form-select"
            required
          >
            <option *ngFor="let status of statusOptions" [value]="status.value">
              {{status.label}}
            </option>
          </select>
        </div>

        <!-- Adresse -->
        <div class="form-group span-2">
          <label for="address" class="form-label">Adresse</label>
          <textarea
            id="address"
            [(ngModel)]="formData.address"
            name="address"
            rows="3"
            placeholder="123 Rue de la Paix, 75001 Paris"
            class="form-textarea"
          ></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          (click)="handleCancel()"
          class="cancel-button"
          [disabled]="isLoading"
        >
          Annuler
        </button>
        <button
          type="submit"
          class="submit-button"
          [disabled]="isLoading"
        >
          <span *ngIf="isLoading" class="loading-spinner"></span>
          {{isLoading ? 'Ajout en cours...' : 'Ajouter l\'utilisateur'}}
        </button>
      </div>
    </form>
  </div>
</div>
