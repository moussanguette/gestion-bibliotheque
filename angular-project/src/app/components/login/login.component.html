<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full mb-4">
        <!-- BookOpen icon -->
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-900">BiblioManager</h1>
      <p class="text-gray-600 mt-2">Système de gestion de bibliothèque</p>
    </div>

    <!-- Card -->
    <div class="bg-white shadow-xl rounded-lg border-0">
      <!-- CardContent -->
      <div class="p-6">
        <!-- Tabs -->
        <div class="w-full">
          <!-- TabsList -->
          <div class="grid w-full grid-cols-2 bg-gray-100 rounded-lg p-1 mb-6">
            <!-- TabsTrigger login -->
            <button
              type="button"
              [class]="activeTab === 'login'
                ? 'inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-white transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-white text-gray-950 shadow-sm'
                : 'inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-white transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 text-gray-600 hover:text-gray-900'"
              (click)="setActiveTab('login')"
            >
              Connexion
            </button>
            <!-- TabsTrigger signup -->
            <button
              type="button"
              [class]="activeTab === 'signup'
                ? 'inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-white transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-white text-gray-950 shadow-sm'
                : 'inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-white transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 text-gray-600 hover:text-gray-900'"
              (click)="setActiveTab('signup')"
            >
              Inscription
            </button>
          </div>

          <!-- TabsContent login -->
          <div *ngIf="activeTab === 'login'" class="space-y-4 mt-6">
            <div class="text-center space-y-1">
              <h2 class="text-2xl font-semibold">Connexion</h2>
              <p class="text-gray-600">Connectez-vous à votre compte</p>
            </div>

            <form (ngSubmit)="handleLoginSubmit()" class="space-y-4">
              <div class="space-y-2">
                <!-- Label -->
                <label for="login-email" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Email</label>
                <!-- Input -->
                <input
                  id="login-email"
                  type="email"
                  placeholder="admin@bibliotheque.fr"
                  [(ngModel)]="loginEmail"
                  name="loginEmail"
                  required
                  class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                />
              </div>

              <div class="space-y-2">
                <!-- Label -->
                <label for="login-password" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Mot de passe</label>
                <div class="relative">
                  <!-- Input -->
                  <input
                    id="login-password"
                    [type]="showLoginPassword ? 'text' : 'password'"
                    placeholder="••••••••"
                    [(ngModel)]="loginPassword"
                    name="loginPassword"
                    required
                    class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 py-2 pr-10 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                  />
                  <!-- Button ghost -->
                  <button
                    type="button"
                    (click)="showLoginPassword = !showLoginPassword"
                    class="absolute right-0 top-0 h-full px-3 inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-white transition-colors hover:bg-transparent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50"
                  >
                    <!-- Eye icon -->
                    <svg *ngIf="!showLoginPassword" class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <!-- EyeOff icon -->
                    <svg *ngIf="showLoginPassword" class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Button primary -->
              <button
                type="submit"
                [disabled]="isLoading"
                class="w-full h-11 inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-blue-600 text-white hover:bg-blue-700"
              >
                {{isLoading ? "Connexion..." : "Se connecter"}}
              </button>
            </form>

          </div>

          <!-- TabsContent signup -->
          <div *ngIf="activeTab === 'signup'" class="space-y-4 mt-6">
            <div class="text-center space-y-1">
              <h2 class="text-2xl font-semibold">Inscription</h2>
              <p class="text-gray-600">Créez votre compte administrateur</p>
            </div>

            <form (ngSubmit)="handleSignupSubmit()" class="space-y-4">
              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                  <label for="signupUsername" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Nom d'utilisateur</label>
                  <input
                    id="signupUsername"
                    type="text"
                    placeholder="jdupont"
                    [(ngModel)]="signupUsername"
                    name="signupUsername"
                    required
                    class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                  />
                </div>
                <div class="space-y-2">
                  <label for="nom" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Nom</label>
                  <input
                    id="nom"
                    type="text"
                    placeholder="NGOM"
                    [(ngModel)]="nom"
                    name="nom"
                    required
                    class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                  />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                  <label for="prenom" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Prénom</label>
                  <input
                    id="prenom"
                    type="text"
                    placeholder="Baba"
                    [(ngModel)]="prenom"
                    name="prenom"
                    required
                    class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                  />
                </div>
                <div class="space-y-2">
                  <label for="telephone" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Téléphone</label>
                  <input
                    id="telephone"
                    type="tel"
                    placeholder="+221772050626"
                    [(ngModel)]="telephone"
                    name="telephone"
                    required
                    class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                  />
                </div>
              </div>

              <div class="space-y-2">
                <label for="adresse" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Adresse</label>
                <input
                  id="adresse"
                  type="text"
                  placeholder="Cite Soprim, DAKAR"
                  [(ngModel)]="adresse"
                  name="adresse"
                  required
                  class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                />
              </div>

              <div class="space-y-2">
                <!-- Label -->
                <label for="signup-email" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Email</label>
                <!-- Input -->
                <input
                  id="signup-email"
                  type="email"
                  placeholder="babangom@bibliotheque.sn"
                  [(ngModel)]="signupEmail"
                  name="signupEmail"
                  required
                  class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                />
              </div>

              <div class="space-y-2">
                <!-- Label -->
                <label for="signup-password" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Mot de passe</label>
                <div class="relative">
                  <!-- Input -->
                  <input
                    id="signup-password"
                    [type]="showSignupPassword ? 'text' : 'password'"
                    placeholder="••••••••"
                    [(ngModel)]="signupPassword"
                    name="signupPassword"
                    required
                    minlength="6"
                    class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 py-2 pr-10 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                  />
                  <!-- Button ghost -->
                  <button
                    type="button"
                    (click)="showSignupPassword = !showSignupPassword"
                    class="absolute right-0 top-0 h-full px-3 inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-white transition-colors hover:bg-transparent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50"
                  >
                    <!-- Eye icon -->
                    <svg *ngIf="!showSignupPassword" class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <!-- EyeOff icon -->
                    <svg *ngIf="showSignupPassword" class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                    </svg>
                  </button>
                </div>
                <p class="text-xs text-gray-500">
                  Le mot de passe doit contenir au moins 6 caractères
                </p>
              </div>

              <!-- Button primary full width -->
              <button
                type="submit"
                [disabled]="isLoading"
                class="w-full h-11 mt-6 inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-blue-600 text-white hover:bg-blue-700"
              >
                {{isLoading ? "Création..." : "Créer le compte"}}
              </button>
            </form>

          </div>
        </div>
      </div>
    </div>

    <!-- Error message -->
    <div *ngIf="errorMessage" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-md">
      <p class="text-red-600 text-sm">{{errorMessage}}</p>
    </div>
  </div>
</div>
