<div class="activity-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-state">
    <div *ngFor="let i of [1,2,3,4,5]" class="activity-skeleton">
      <div class="skeleton-indicator"></div>
      <div class="skeleton-content">
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
    </div>
  </div>

  <!-- Activity List -->
  <div *ngIf="!loading" class="activity-list">
    <div
      *ngFor="let activity of activities; trackBy: trackByActivityId"
      class="activity-item"
    >
      <div class="activity-timeline">
        <div [class]="'activity-indicator ' + getActivityColor(activity.type)">
          <!-- Loan Icon -->
          <svg
            *ngIf="getActivityIcon(activity.type) === 'loan'"
            class="activity-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>

          <!-- Return Icon -->
          <svg
            *ngIf="getActivityIcon(activity.type) === 'return'"
            class="activity-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path>
          </svg>

          <!-- Book Icon -->
          <svg
            *ngIf="getActivityIcon(activity.type) === 'book'"
            class="activity-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>

          <!-- User Icon -->
          <svg
            *ngIf="getActivityIcon(activity.type) === 'user'"
            class="activity-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>

          <!-- Info Icon (default) -->
          <svg
            *ngIf="getActivityIcon(activity.type) === 'info'"
            class="activity-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div class="timeline-line"></div>
      </div>

      <div class="activity-content">
        <div class="activity-details">
          <p class="activity-description">{{activity.description}}</p>
          <div class="activity-meta">
            <span class="activity-time">{{getTimeAgo(activity.timestamp)}}</span>
            <span *ngIf="activity.userEmail" class="activity-user">
              • {{activity.userEmail}}
            </span>
          </div>
        </div>

        <div *ngIf="activity.bookTitle" class="activity-badge">
          <svg class="badge-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
          </svg>
          <span class="badge-text">{{activity.bookTitle}}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && activities.length === 0" class="empty-state">
    <div class="empty-content">
      <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
      </svg>
      <h3 class="empty-title">Aucune activité récente</h3>
      <p class="empty-text">
        Les dernières actions effectuées dans la bibliothèque s'afficheront ici.
      </p>
    </div>
  </div>

  <!-- View All Button -->
  <div *ngIf="!loading && activities.length > 0" class="view-all-container">
    <button class="view-all-button">
      Voir toute l'activité
      <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </button>
  </div>
</div>
